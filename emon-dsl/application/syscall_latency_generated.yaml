tool:
  name: syscall_latency_monitor
  version: "0.1"
  description: >
    Emon DSL 生成的 eBPF 可观测性工具
  language: emon-dsl
  target: bpf
  options:
    min_latency: 100us

maps:
  - name: count
    type: hash
    key_fields: [comm, pid]
    value_type: u64
    max_entries: 10240

probes:
  - section: tracepoint/syscalls/sys_enter_read
    kind: syscall
    target: read
    is_exit: false
    measures_latency: true
    where: [
      - "(pid > 0)"
    ]
  - section: tracepoint/syscalls/sys_exit_read
    kind: syscall
    target: read
    is_exit: true
    measures_latency: true
    when: [
      - "(latency > min_latency)"
    ]
    aggregations:
      - map: count
        fn: count
        keys: [comm, pid]
    emits: 1 event(s)
  - section: tracepoint/syscalls/sys_enter_write
    kind: syscall
    target: write
    is_exit: false
    measures_latency: true
    where: [
      - "(pid > 0)"
    ]
  - section: tracepoint/syscalls/sys_exit_write
    kind: syscall
    target: write
    is_exit: true
    measures_latency: true
    when: [
      - "(latency > min_latency)"
    ]
    aggregations:
      - map: count
        fn: count
        keys: [comm, pid]
    emits: 1 event(s)
  - section: tracepoint/syscalls/sys_enter_openat
    kind: syscall
    target: openat
    is_exit: false
    measures_latency: true
    where: [
      - "(pid > 0)"
    ]
  - section: tracepoint/syscalls/sys_exit_openat
    kind: syscall
    target: openat
    is_exit: true
    measures_latency: true
    when: [
      - "(latency > min_latency)"
    ]
    aggregations:
      - map: count
        fn: count
        keys: [comm, pid]
    emits: 1 event(s)

events:
  - name: event_syscall_latency_monitor
    type: ringbuf
    fields:
      - name: time
        type: u64
      - name: syscall
        type: char [16]
      - name: pid
        type: u32
      - name: comm
        type: char [16]
      - name: latency
        type: u64

lifecycle:
  begin: []
  every:
    - interval: 1s
      prints:
        - "=== 系统调用延迟统计 ==="
        - @count
      agg_reads: [count]
  end:
    - print: "=== 最终统计报告 ==="
    - print: @count

outputs:
  - kind: stdout
    format: table
    refresh: 1s
