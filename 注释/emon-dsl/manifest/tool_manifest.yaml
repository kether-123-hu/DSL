# ===================================================================
# tool_manifest.yaml —— Emon DSL 工具清单模板
# ===================================================================
#
# 【本文件的作用】
# 这是工具清单（Manifest）的模板文件。
# 编译器（manifest_gen.py）会读取 IR 并填充此模板中的占位符，
# 生成最终的工具描述文件。
#
# 【清单文件的用途】
# 清单文件用 YAML 格式描述了 eBPF 工具的完整结构，
# 用于:
#   1. 工具发现——让管理系统知道有哪些监控工具可用
#   2. 文档生成——自动生成工具的使用文档
#   3. 依赖分析——了解工具需要哪些内核特性支持
#
# 【YAML 语法提示】
#   缩进表示层级关系（不能用 Tab，只能用空格）
#   key: value   表示键值对
#   - item       表示列表项
#   >            表示多行字符串（折叠换行）
#   #             表示注释
# ===================================================================

# ---- 工具基本信息 ----
tool:
  name: <TOOL_NAME>      # 工具名称（由编译器根据 tool 声明填充）
  version: "0.1"          # 版本号
  description: >          # 工具描述（多行字符串）
    Emon DSL 生成的 eBPF 工具（全系统可观测性监控）
  
  # 配置选项及其默认值
  options:
    target_pid: 0         # 目标进程 ID（0=所有进程）
    min_latency: 10000    # 最小延迟过滤阈值（纳秒）
    interval_ms: 1000     # 报告间隔（毫秒）

# ---- BPF Map 列表 ----
# 每个聚合变量 (@xxx) 对应一个 BPF map
maps: []

# ---- 探针列表 ----
# 每个 observe 块展开为一个或多个探针
probes: []

# ---- 事件列表 ----
# emit 语句产生的事件结构
events: []

# ---- 输出配置 ----
# 定义工具的输出方式
outputs:
  - kind: stdout          # 输出到标准输出
    format: table         # 表格格式
    refresh: 1000ms       # 刷新频率（毫秒）
